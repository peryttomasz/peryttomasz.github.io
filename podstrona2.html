<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Dane osobowe - Formularz</title>
</head>
<body>

  <h1>Formularz danych osobowych</h1>

  <form>
    <label>Imię: <input type="text"></label><br>
    <label>Nazwisko: <input type="text"></label><br>
    <label>Ulica: <input type="text"></label><br>
    <label>Miasto: <input type="text"></label><br>
    <label>Hasło: <input type="password"></label><br>
    <label>Data urodzenia: <input type="date"></label><br>
    <label>Telefon: <input type="tel"></label><br>
    <label>E-mail: <input type="email"></label><br>
    <label>Województwo:
      <select>
        <option>mazowieckie</option>
        <option>małopolskie</option>
        <option>wielkopolskie</option>
        <option>Lubelskie</option>
        <option>lubuskie</option>
        <option>podkarpackie</option>
        <option>pomorskie</option>
        <option>warmińsko-mazurskie</option>
        <option>świętokrzyskie</option>
        <option>opolskie</option>
        <option>dolnośląskie</option>
        <option>zachodnio-pomorskie</option>
        <option>łódzkie</option>
        <option>śląskie</option>
        <option>podlaskie</option>
        <option>kujawsko-pomorskie</option>
      </select>
    </label><br>
    <label>Uwagi: <textarea rows="4" cols="30"></textarea></label><br>
    <label>Prawo jazdy: <input type="checkbox"></label><br>
    <button type="submit">Wyślij</button>
  </form>

</body>
</html>
