<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Dane osobowe - Formularz</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .blad { color: red; font-size: 13px; margin-left: 8px; }
  </style>
</head>
<body>

  <h1>Formularz danych osobowych</h1>

  <form onsubmit="return sprawdz()" novalidate>
    <label>Imię:</label> 
    <input type="text" id="imie" placeholder="np. Jan">
    <span id="err_imie" class="blad"></span><br>

    <label>Nazwisko:</label> 
    <input type="text" id="nazwisko" placeholder="np. Kowalski">
    <span id="err_nazwisko" class="blad"></span><br>

    <label>Ulica:</label> 
    <input type="text" id="ulica" placeholder="np. Kwiatowa 12">
    <span id="err_ulica" class="blad"></span><br>

    <label>Miasto:</label> 
    <input type="text" id="miasto" placeholder="np. Warszawa">
    <span id="err_miasto" class="blad"></span><br>

    <label>Hasło:</label> 
    <input type="password" id="haslo" placeholder="Min. 6 znaków">
    <span id="err_haslo" class="blad"></span><br>

    <label>Data urodzenia:</label> 
    <input type="date" id="data">
    <span id="err_data" class="blad"></span><br>

    <label>Telefon:</label> 
    <input type="tel" id="telefon" placeholder="Format: 123-456-789 lub 123456789">
    <span id="err_telefon" class="blad"></span><br>

    <label>E-mail:</label> 
    <input type="email" id="email" placeholder="Format: nazwa@domena.pl">
    <span id="err_email" class="blad"></span><br>
    
    <label>Województwo:</label>
    <select id="wojewodztwo">
      <option>mazowieckie</option>
      <option>małopolskie</option>
      <option>wielkopolskie</option>
      <option>lubelskie</option>
      <option>lubuskie</option>
      <option>podkarpackie</option>
      <option>pomorskie</option>
      <option>warmińsko-mazurskie</option>
      <option>świętokrzyskie</option>
      <option>opolskie</option>
      <option>dolnośląskie</option>
      <option>zachodniopomorskie</option>
      <option>łódzkie</option>
      <option>śląskie</option>
      <option>podlaskie</option>
      <option>kujawsko-pomorskie</option>
    </select><br>

    <label>Uwagi:</label> 
    <textarea id="uwagi" rows="4" cols="30"></textarea><br>
    
    <label>Prawo jazdy:</label>
    <input type="radio" name="prawo_jazdy" id="pj_tak" value="tak"> Posiadam
    <input type="radio" name="prawo_jazdy" id="pj_nie" value="nie"> Nie posiadam
    <span id="err_pj" class="blad"></span><br>
    
    <button type="submit">Wyślij</button>
    <button type="reset" onclick="wyczyscBledy()">Wyczyść formularz</button>
  </form>

  <script>
    function wyczyscBledy() {
      let bledy = document.querySelectorAll(".blad");
      for (let i = 0; i < bledy.length; i++) {
        bledy[i].innerText = "";
      }
    }

    function sprawdz() {
      wyczyscBledy();
      let poprawny = true;

      let imie = document.getElementById("imie").value;
      let nazwisko = document.getElementById("nazwisko").value;
      let ulica = document.getElementById("ulica").value;
      let miasto = document.getElementById("miasto").value;
      let haslo = document.getElementById("haslo").value;
      let data = document.getElementById("data").value;
      let telefon = document.getElementById("telefon").value;
      let email = document.getElementById("email").value;
      let pjTak = document.getElementById("pj_tak").checked;
      let pjNie = document.getElementById("pj_nie").checked;

      let wzorTekst = /^[A-ZĄĆĘŁŃÓŚŹŻ][a-ząćęłńóśźż]{1,}$/;
      let wzorTelefon = /^(\d{9}|\d{3}-\d{3}-\d{3})$/;
      let wzorEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      if (!wzorTekst.test(imie)) {
        document.getElementById("err_imie").innerText = "Błąd! Wpisz imię z wielkiej litery (tylko litery, np. Jan).";
        poprawny = false;
      }

      if (!wzorTekst.test(nazwisko)) {
        document.getElementById("err_nazwisko").innerText = "Błąd! Wpisz nazwisko z wielkiej litery (np. Kowalski).";
        poprawny = false;
      }

      if (ulica.length < 3) {
        document.getElementById("err_ulica").innerText = "Błąd! Podaj ulicę i numer (min. 3 znaki).";
        poprawny = false;
      }

      if (!wzorTekst.test(miasto)) {
        document.getElementById("err_miasto").innerText = "Błąd! Wpisz miasto z wielkiej litery (np. Warszawa).";
        poprawny = false;
      }

      if (haslo.length < 6) {
        document.getElementById("err_haslo").innerText = "Błąd! Hasło musi mieć minimum 6 znaków.";
        poprawny = false;
      }

      if (data === "") {
        document.getElementById("err_data").innerText = "Błąd! Wybierz datę urodzenia.";
        poprawny = false;
      }

      if (!wzorTelefon.test(telefon)) {
        document.getElementById("err_telefon").innerText = "Błąd! Oczekiwany format: 123456789 lub 123-456-789.";
        poprawny = false;
      }

      if (!wzorEmail.test(email)) {
        document.getElementById("err_email").innerText = "Błąd! Oczekiwany format: nazwa@domena.pl";
        poprawny = false;
      }

      if (!pjTak && !pjNie) {
        document.getElementById("err_pj").innerText = "Błąd! Zaznacz jedną z opcji.";
        poprawny = false;
      }

      if (poprawny) {
        alert("Formularz wypełniony poprawnie! Dane zostały wysłane.");
      }

      return poprawny;
    }
  </script>

</body>
</html>
