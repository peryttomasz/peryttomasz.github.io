<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Układ kolumn - Podstrona 1</title>
</head>
<body>

  <h1>Układ kolumn</h1>
  <h2>Układ 1-kolumnowy</h2>
  <div class="jedna-kolumna">
    <p>Tekst w układzie jednej kolumny.</p>
  </div>
  <h2>Układ 2-kolumnowy</h2>
  <div class="kontener-2-kolumny">
    <div class="kolumna">
      <p>Treść w lewej kolumnie...</p>
    </div>
    <div class="kolumna">
      <p>Treść w prawej kolumnie...</p>
    </div>
  </div>
  <h2>Kontener 3 kolumny</h2>
  <div class="kontener-3-kolumny">
    <div class="kolumna">
      <p>Treść w lewej kolumnie...</p>
    </div>
    <div class="kolumna">
      <p>Treść w środkowej kolumnie...</p>
    </div>
    <div class="kolumna">
      <p>Treść w prawej kolumnie...</p>
    </div>
  </div>
  
</body>
</html>
