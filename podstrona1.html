<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Dane osobowe - Formularz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Formularz danych osobowych</h1>

  <form onsubmit="return sprawdz()">
    <label>Imię:</label> <input type="text" id="imie"><br>
    <label>Nazwisko:</label> <input type="text" id="nazwisko"><br>
    <label>Ulica:</label> <input type="text" id="ulica"><br>
    <label>Miasto:</label> <input type="text" id="miasto"><br>
    <label>Hasło:</label> <input type="password" id="haslo"><br>
    <label>Data urodzenia:</label> <input type="date" id="data"><br>
    <label>Telefon:</label> <input type="tel" id="telefon"><br>
    <label>E-mail:</label> <input type="email" id="email"><br>
    
    <label>Województwo:</label>
    <select id="wojewodztwo">
      <option>mazowieckie</option>
      <option>małopolskie</option>
      <option>wielkopolskie</option>
      <option>lubelskie</option>
      <option>lubuskie</option>
      <option>podkarpackie</option>
      <option>pomorskie</option>
      <option>warmińsko-mazurskie</option>
      <option>świętokrzyskie</option>
      <option>opolskie</option>
      <option>dolnośląskie</option>
      <option>zachodniopomorskie</option>
      <option>łódzkie</option>
      <option>śląskie</option>
      <option>podlaskie</option>
      <option>kujawsko-pomorskie</option>
    </select><br>

    <label>Uwagi:</label> <textarea id="uwagi" rows="4" cols="30"></textarea><br>
    
    <label>Prawo jazdy:</label>
    <input type="radio" name="prawo_jazdy" id="pj_tak" value="tak"> Posiadam
    <input type="radio" name="prawo_jazdy" id="pj_nie" value="nie"> Nie posiadam<br>
    
    <button type="submit">Wyślij</button>
    <button type="reset">Wyczyść formularz</button>
  </form>

  <script>
    function sprawdz() {
      let imie = document.getElementById("imie").value;
      let nazwisko = document.getElementById("nazwisko").value;
      let ulica = document.getElementById("ulica").value;
      let miasto = document.getElementById("miasto").value;
      let haslo = document.getElementById("haslo").value;
      let data = document.getElementById("data").value;
      let telefon = document.getElementById("telefon").value;
      let email = document.getElementById("email").value;
      let pjTak = document.getElementById("pj_tak").checked;
      let pjNie = document.getElementById("pj_nie").checked;

      if (imie === "" || nazwisko === "" || ulica === "" || miasto === "" || data === "") {
        alert("Wypełnij wszystkie dane adresowe i datę urodzenia!");
        return false;
      }

      if (haslo.length < 6) {
        alert("Hasło musi mieć co najmniej 6 znaków!");
        return false;
      }

      if (telefon.length !== 9 || isNaN(telefon)) {
        alert("Podaj poprawny, 9-cyfrowy numer telefonu (same cyfry)!");
        return false;
      }

      if (!email.includes("@") || !email.includes(".")) {
        alert("Podaj poprawny adres e-mail!");
        return false;
      }

      if (!pjTak && !pjNie) {
        alert("Zaznacz czy posiadasz prawo jazdy!");
        return false;
      }

      alert("Formularz wypełniony poprawnie!");
      return true;
    }
  </script>

</body>
</html>
