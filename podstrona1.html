<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Układ kolumn - Podstrona 1</title>
  <style>
    .kontener-2-kolumny,
    .kontener-3-kolumny {
      display: flex;
      gap: 20px;
      margin-bottom: 25px;
    }

    .kolumna {
      flex: 1
      background-color: #f2f2f2;
      padding: 15px;
      border: 1px solid #ccc;
    }

    .jedna-kolumna {
      background-color: #f2f2f2;
      padding: 15px;
      border: 1px solid #ccc;
      margin-bottom: 25px;
    }
  </style>
</head>
<body>

  <h1>Układ kolumn</h1>
  <h2>Układ 1-kolumnowy</h2>
  <div class="jedna-kolumna">
    <p>Tekst w układzie jednej kolumny.</p>
  </div>
  <h2>Układ 2-kolumnowy</h2>
  <div class="kontener-2-kolumny">
    <div class="kolumna">
      <p>Treść w lewej kolumnie...</p>
    </div>
    <div class="kolumna">
      <p>Treść w prawej kolumnie...</p>
    </div>
  </div>
  <h2>Kontener 3 kolumny</h2>
  <div class="kontener-3-kolumny">
    <div class="kolumna">
      <p>Treść w lewej kolumnie...</p>
    </div>
    <div class="kolumna">
      <p>Treść w środkowej kolumnie...</p>
    </div>
    <div class="kolumna">
      <p>Treść w prawej kolumnie...</p>
    </div>
  </div>
  
</body>
</html>
